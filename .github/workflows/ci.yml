name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, build & CV check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Fails the job when a CV exceeds the page limit (see scripts/generate-cv-pdf.mjs)
      - name: Generate CV PDFs
        run: npm run cv:pdf

      - name: Upload CV PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: dist/*.pdf
          if-no-files-found: error
